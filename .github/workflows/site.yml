name: Site

# Public site (landing, roadmap, changelog) on Cloudflare Pages, served at
# auralisgo.com. Publishes after each merge to main that touches it.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "CHANGELOG.md"
      - "ROADMAP.md"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

# Only the latest main matters: a newer publish replaces an older one.
concurrency:
  group: site
  cancel-in-progress: true

jobs:
  deploy:
    name: deploy
    # Production is main only: a manual run from another branch must not publish it.
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    timeout-minutes: 15
    env:
      PROJECT: fossil-site
      # Exact version, at least two weeks old; bump on purpose.
      WRANGLER: wrangler@4.146.0
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # The site has no dependencies of its own: it uses the desktop app's Vite.
      - name: Build
        run: |
          & apps\desktop\node_modules\.bin\vite.cmd build --config site/vite.config.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The token is only exposed to the steps that need it, never to
      # `pnpm install` (dependency scripts) or the build.
      - name: Check Cloudflare secrets
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          $ready = if ($env:CLOUDFLARE_API_TOKEN -and $env:CLOUDFLARE_ACCOUNT_ID) { "true" } else { "false" }
          if ($ready -eq "false") { Write-Output "::warning::Faltan los secrets de Cloudflare: el sitio se construyó pero no se publicó." }
          "ready=$ready" | Add-Content -Encoding ascii $env:GITHUB_OUTPUT

      # Creates the Pages project once, through the REST API. `wrangler pages
      # project create` runs app detection, which fails at a monorepo root.
      - name: Ensure Pages project y publicar
        if: steps.secrets.outputs.ready == 'true'
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $token = ($env:RAW_TOKEN -replace '^(?i)Bearer\s+', '').Trim(" `t`r`n`"'")
          $acct  = $env:RAW_ACCOUNT.Trim(" `t`r`n`"'")
          if ($token -match '^[0-9a-fA-F]{32}$' -and $acct -notmatch '^[0-9a-fA-F]{32}$') {
            Write-Output "Detected swapped token and account ID; swapping in memory."
            $tmp = $token; $token = $acct; $acct = $tmp
          }
          $headers = @{ Authorization = "Bearer $token" }
          try {
            $verify = Invoke-RestMethod -Uri "https://api.cloudflare.com/client/v4/user/tokens/verify" -Headers $headers -Method Get
            Write-Output "Token status: $($verify.result.status)"
          } catch {
            Write-Output "Token verify endpoint returned error (token length: $($token.Length), account is 32-hex: $($acct -match '^[0-9a-fA-F]{32}$'))"
          }
          try {
            $accts = Invoke-RestMethod -Uri "https://api.cloudflare.com/client/v4/accounts" -Headers $headers -Method Get
            if ($accts.result -and $accts.result.Count -gt 0 -and ($accts.result.id -notcontains $acct)) {
              Write-Output "Using account ID associated with token."
              $acct = $accts.result[0].id
            }
          } catch {}
          $api = "https://api.cloudflare.com/client/v4/accounts/$acct/pages/projects"
          try {
            Invoke-RestMethod -Uri "$api/$env:PROJECT" -Headers $headers -Method Get | Out-Null
            Write-Output "Pages project $env:PROJECT already exists"
          } catch {
            if ($_.Exception.Response.StatusCode.value__ -eq 404) {
              $body = @{ name = $env:PROJECT; production_branch = "main" } | ConvertTo-Json
              Invoke-RestMethod -Uri $api -Headers $headers -Method Post -ContentType "application/json" -Body $body | Out-Null
              Write-Output "Created Pages project $env:PROJECT"
            } else {
              Write-Output "Skipping project creation check (status: $($_.Exception.Response.StatusCode.value__)); proceeding to wrangler deploy."
            }
          }
          $env:CLOUDFLARE_API_TOKEN = $token
          $env:CLOUDFLARE_ACCOUNT_ID = $acct
          pnpm dlx $env:WRANGLER pages deploy site/dist --project-name $env:PROJECT --branch main --commit-hash $env:GITHUB_SHA --commit-dirty=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
