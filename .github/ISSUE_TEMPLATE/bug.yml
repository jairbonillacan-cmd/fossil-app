name: Bug
description: Algo no funciona como debería
labels: ["type:bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: Qué pasa
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Qué esperabas
  - type: input
    id: version
    attributes:
      label: Versión de Fossil / commit
  - type: textarea
    id: logs
    attributes:
      label: Logs o capturas
