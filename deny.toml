# cargo-deny configuration for Fossil workspace (#59).
# Run: cargo deny check advisories licenses sources

[graph]
targets = [
    { triple = "x86_64-pc-windows-msvc" },
]

[advisories]
unmaintained = "none"
yanked = "warn"
ignore = [
    # quick-xml advisories pulled transitively by `plist` (macOS-only target dependency of `tauri-utils`);
    # Fossil is a Windows desktop application and never compiles or executes `plist` at runtime.
    { id = "RUSTSEC-2026-0194", reason = "Transitive via plist in tauri-utils (macOS-only); not compiled on Windows." },
    { id = "RUSTSEC-2026-0195", reason = "Transitive via plist in tauri-utils (macOS-only); not compiled on Windows." },
]

[licenses]
unused-allowed-license = "allow"
private = { ignore = true }
allow = [
    "AGPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
    "OpenSSL",
]
confidence-threshold = 0.8

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
