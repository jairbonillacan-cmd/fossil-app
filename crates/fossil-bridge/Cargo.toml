[package]
name = "fossil-bridge"
description = "Fossil local agent bridge: runs official CLIs (agy, claude, codex) as child processes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
fossil-ai = { path = "../fossil-ai" }
async-trait = "0.1"
serde_json = "1.0.149"
tokio = { version = "1.51.1", features = ["process", "io-util", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1.51.1", features = ["macros", "rt", "process", "io-util", "sync", "time"] }

[lints]
workspace = true
