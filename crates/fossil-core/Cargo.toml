[package]
name = "fossil-core"
description = "Fossil domain core: graph objects, types, CRDT, storage and queries"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
# specta pinned to the exact RC required by tauri-specta (apps/desktop).
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# UTC millisecond <-> ISO-8601 conversion at the storage boundary.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
thiserror = "2"
# Ulid as string newtype: the public contract is a string both in SQLite and TS.
ulid = "3"
# canonicalize without the Windows verbatim prefix (\\?\), so paths shown in the UI stay readable.
dunce = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
# Yjs (CRDT) documents: update merging/validation for persistence (ADR-0003).
yrs = "0.28"
rusqlite_migration = "2.6"

[dev-dependencies]
tempfile = "3"
proptest = "1"

[lints]
workspace = true
