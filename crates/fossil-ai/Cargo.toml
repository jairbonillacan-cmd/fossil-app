[package]
name = "fossil-ai"
description = "Fossil AI router and API providers: streaming, tool calling, costs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
# specta pinned to the exact RC required by tauri-specta (apps/desktop).
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
async-trait = "0.1" # dyn-compatible Provider trait (Vec<Box<dyn Provider>>).
tokio = { version = "1.51.1", features = ["sync", "time"] } # channels and request timeouts (#32/#33).
ulid = "3" # RequestId as string newtype, same convention as fossil-core ids.
serde_json = "1.0.149"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls", "charset", "http2", "system-proxy"] }
keyring = { version = "3.6.3", features = ["windows-native"] }

[dev-dependencies]
tokio = { version = "1.51.1", features = ["macros", "rt", "net", "io-util", "time", "sync"] }

[lints]
workspace = true
