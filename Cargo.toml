[workspace]
resolver = "3"
# Members are added as they are created. An unmatched glob makes cargo fail,
# so each path is listed explicitly.
members = [
  "apps/desktop/src-tauri",
  "crates/fossil-core",
  "crates/fossil-ai",
  "crates/fossil-bridge",
  "crates/fossil-mcp",
  "crates/fossil-data",
  "crates/fossil-os",
  "crates/fossil-proto",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
publish = false
repository = "https://github.com/jairbonillacan-cmd/fossil-app"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# DoD: no unwrap()/expect() in production paths without a justifying comment
# (use #[allow(clippy::unwrap_used)] + comment). Tests are exempt via clippy.toml.
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
