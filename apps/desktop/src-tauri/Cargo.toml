[package]
name = "fossil-desktop"
description = "Fossil desktop app shell (Tauri 2)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
fossil-core = { path = "../../../crates/fossil-core" }
# tauri-specta is still an RC line: exact pins (spec r0-foundations §Riesgos).
specta = "=2.0.0-rc.25"
specta-typescript = "=0.0.12"
tauri = { version = "2.12.3", features = ["tray-icon"] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
tauri-plugin-dialog = "2.8.2"
tauri-plugin-single-instance = "2.5.3"
tauri-plugin-window-state = "2.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
fossil-ai = { path = "../../../crates/fossil-ai" } # AI contract (#16): ai_* + ai:event.
# Timer for idle Yjs compaction (#18); same runtime Tauri already uses.
tokio = { version = "1", features = ["time"] }
# Quick capture (#9): global shortcut; the tray is created by the shell.
tauri-plugin-global-shortcut = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] } # async tests for the ai_* stubs.

[lints]
workspace = true
