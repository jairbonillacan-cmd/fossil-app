<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fossil</title>
    <style>
      html {
        color-scheme: light dark;
      }
      html[data-theme="light"] {
        color-scheme: light;
      }
      html[data-theme="dark"] {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        background: transparent;
      }
    </style>
    <script>
      try {
        const theme = localStorage.getItem("fossil.theme");
        if (theme === "light" || theme === "dark") {
          document.documentElement.dataset.theme = theme;
        }
      } catch {
        // Storage unavailable: fallback to system color-scheme.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
